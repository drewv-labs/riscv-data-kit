# Path: riscv-data-kit/.github/workflows/ci.yml
name: RVDK Integrity, ShellCheck & Security CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run RVDK manifest, symlink, syntax & agnosticism checks
        run: python3 tools/rvdk_ci.py --check

      - name: Run ShellCheck across repository scripts
        run: |
          find . -path './.git' -prune -o -path './_site' -prune -o -name '*.sh' -type f -print0 \
            | xargs -0 shellcheck -x -S warning

      - name: Verify standalone Pages bundler & ShellCheck bundled artifacts
        run: |
          python3 tools/rvdk_ci.py --bundle-dist _site
          find _site -name '*.sh' -type f -print0 | xargs -0 shellcheck -S warning
