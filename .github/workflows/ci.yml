# Path: riscv-data-kit/.github/workflows/ci.yml
name: RVDK Integrity, ShellCheck & Security CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install locked Python lint, typecheck & test dependencies
        run: uv sync --frozen

      - name: Run Ruff lint on Python tooling and tests
        run: uv run --frozen ruff check tools tests

      - name: Run basedpyright static type check on Python tooling and tests
        run: uv run --frozen basedpyright tools tests

      - name: Run RVDK manifest, symlink, syntax, ShellCheck, bundler & security checks
        run: uv run --frozen python3 tools/rvdk_ci.py --check

      - name: Run unit and shell library regression suite
        run: uv run --frozen pytest -v
