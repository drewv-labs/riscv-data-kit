# Path: riscv-data-kit/.github/workflows/pages.yml
name: Deploy RVDK to GitHub Pages (Dereference Symlinks)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage static tree and dereference board/version symlinks (cp -rL)
        run: |
          mkdir -p _site
          # Copy all top-level RVDK directories while dereferencing symlinks (-L)
          for item in bootstrap.sh install-cli.sh lib bsp boards mods os postgresql utils mosquitto nfs-vault storage README.md LICENSE; do
            if [ -e "$item" ]; then
              cp -rL "$item" _site/
            fi
          done
          echo "rvdk.drewv-labs.dev" > _site/CNAME
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
