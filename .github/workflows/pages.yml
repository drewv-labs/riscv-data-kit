# Path: riscv-data-kit/.github/workflows/pages.yml
name: Deploy RVDK to GitHub Pages (Standalone Bundler)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manifests, symlinks, agnosticism & ShellCheck
        run: |
          python3 tools/rvdk_ci.py --check
          find . -path './.git' -prune -o -path './_site' -prune -o -name '*.sh' -type f -print0 \
            | xargs -0 shellcheck -x -S warning

      - name: Bundle standalone endpoints and dereference symlinks
        run: |
          python3 tools/rvdk_ci.py --bundle-dist _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "_site"
          include-hidden-files: "true"

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
