[project]
name = "riscv-data-kit"
version = "0.1.0"
description = "Bare-metal RISC-V Day-0 bootstrapper, media flasher, and CI verification tooling"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["_site", "dist", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.basedpyright]
include = ["tools", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingParameterType = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
